# Portal de administración: archivos estáticos de la build de Vite + proxy a la API.
# El navegador habla con un solo origen: sin CORS y sin URL de API fija en la build.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /ready  { proxy_pass http://api:3000; }
    location = /health { proxy_pass http://api:3000; }

    # Ojo: un add_header dentro de un location anula TODOS los add_header del server.
    # Por eso la caché se controla con `expires`, que no pisa los headers de seguridad.

    # Los assets llevan hash en el nombre: se pueden cachear por un año.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html (sin caché, para tomar builds nuevas).
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
