name: ticketing

services:
  secrets:
    image: node:24-alpine
    command: ["node", "/scripts/init-secrets.mjs"]
    volumes:
      - ./infra/secrets:/scripts:ro
      - db-secrets:/out/db
      - api-secrets:/out/api
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      POSTGRES_USER: ${DB_OWNER_USER:-ticketing_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets-gen/db_owner_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-secrets:/run/secrets-gen:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Aplica migraciones y semilla y termina. La API (y luego el portal) esperan a que
  # este servicio salga con código 0: si una migración falla, nada arranca sobre un
  # esquema a medias.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ticketing-api:local
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ticketing}
      DB_OWNER_USER: ${DB_OWNER_USER:-ticketing_owner}
      DB_OWNER_PASSWORD_FILE: /run/secrets-gen/db_owner_password
      DB_APP_PASSWORD_FILE: /run/secrets-gen/db_app_password
    volumes:
      # Solo los dos archivos que necesita: migrate nunca ve la llave de firma ni el
      # secreto JWT que viven en el mismo volumen de la API.
      - type: volume
        source: db-secrets
        target: /run/secrets-gen/db_owner_password
        read_only: true
        volume:
          subpath: db_owner_password
      - type: volume
        source: api-secrets
        target: /run/secrets-gen/db_app_password
        read_only: true
        volume:
          subpath: db_app_password
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    # Misma imagen que migrate (mismo build: el segundo sale de la caché).
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ticketing-api:local
    environment:
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ticketing}
      DB_APP_PASSWORD_FILE: /run/secrets-gen/db_app_password
      JWT_ACCESS_SECRET_FILE: /run/secrets-gen/jwt_access_secret
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      # Peticiones por minuto y por IP: login y registro, y límite global.
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      RATE_LIMIT: ${RATE_LIMIT:-300}
    volumes:
      # Volumen completo de la API: contraseña de la base, secreto JWT y par Ed25519.
      - api-secrets:/run/secrets-gen:ro
    ports:
      # Por defecto solo en localhost. Para probar Expo en un teléfono físico:
      # API_BIND=0.0.0.0 (ver README).
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # "Healthy" = /ready: base accesible con el rol de app y esquema en la versión esperada.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: ticketing-admin:local
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  db-secrets:
  api-secrets: